{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register | CampusConnect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Create your CampusConnect account to join your university community and manage events.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>
    <main class="main-content">
        <div class="container">
            <div class="register-container">
                <div class="register-header">
                    <h1>Create Your Account</h1>
                    <p>Join CampusConnect to connect with your university community</p>
                </div>

                <form class="register-form" id="registerForm" action="{% url 'register_user' %}" method="POST">
                    {% csrf_token %}

                    {% if messages %}
                    <div class="messages">
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            <i class="fas fa-info-circle"></i>
                            {{ message }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user"></i>
                                <input type="text" id="firstName" name="first_name" placeholder="Enter your first name"
                                    required>
                            </div>
                            <div class="error-message" id="firstName-error"></div>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user"></i>
                                <input type="text" id="lastName" name="last_name" placeholder="Enter your last name"
                                    required>
                            </div>
                            <div class="error-message" id="lastName-error"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <div class="error-message" id="email-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Create a password"
                                required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-meter" id="strengthMeter"></div>
                            <div class="strength-text" id="strengthText">Weak</div>
                        </div>
                        <div class="error-message" id="password-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" name="cpassword"
                                placeholder="Confirm your password" required>
                            <button type="button" class="toggle-password" id="toggleConfirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="confirmPassword-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="university">University</label>
                        <div class="input-wrapper">
                            <i class="fas fa-university"></i>
                            <select id="university" name="university" required>
                                <option value="" disabled selected>Select your university</option>
                                <option value="state">State University</option>
                                <option value="tech">Tech Institute</option>
                                <option value="city">City College</option>
                                <option value="liberal">Liberal Arts College</option>
                            </select>
                        </div>
                        <div class="error-message" id="university-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="studentId">Student ID (Optional)</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="studentId" name="student_id" placeholder="Enter your student ID">
                        </div>
                    </div>

                    <div class="form-group terms-group">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">
                                I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and
                                <a href="privacy.html" target="_blank">Privacy Policy</a>
                            </label>
                        </div>
                        <div class="error-message" id="terms-error"></div>
                    </div>

                    <button type="submit" class="register-btn">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>

                    <div class="login-link">
                        Already have an account? <a href="{% url 'login' %}">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="{% static 'js/register.js' %}"></script>
</body>

</html>
